<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meta-Agent Studio</title>
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; max-width: 850px; margin: 40px auto; padding: 0 20px; background: #090d16; color: #f1f5f9; }
    h1 { color: #38bdf8; margin-bottom: 5px; }
    p.subtitle { color: #94a3b8; margin-top: 0; margin-bottom: 25px; }
    textarea { width: 100%; padding: 14px; border-radius: 8px; border: 1px solid #334155; background: #1e293b; color: white; font-size: 16px; box-sizing: border-box; }
    button { background: #0284c7; color: white; border: none; padding: 14px 24px; font-size: 16px; font-weight: bold; border-radius: 8px; cursor: pointer; margin-top: 10px; width: 100%; transition: 0.2s; }
    button:hover { background: #0369a1; }
    button:disabled { background: #475569; cursor: not-allowed; }
    .loader { display: none; margin: 20px 0; color: #38bdf8; font-weight: bold; }
    .agent-card { background: #1e293b; border-left: 5px solid #38bdf8; padding: 20px; margin-top: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
    .agent-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; border-bottom: 1px solid #334155; padding-bottom: 8px; }
    .agent-name { font-size: 18px; font-weight: bold; color: #38bdf8; }
    .agent-role { background: #0f172a; padding: 4px 10px; border-radius: 12px; font-size: 13px; color: #94a3b8; }
    .agent-task { font-style: italic; color: #cbd5e1; margin-bottom: 12px; font-size: 14px; }
    pre { white-space: pre-wrap; font-family: inherit; line-height: 1.5; margin: 0; color: #f8fafc; }
  </style>
</head>
<body>

  <h1>⚡ Meta-Agent Studio</h1>
  <p class="subtitle">Assign any goal. Python will dynamically generate and run a custom AI agent team.</p>

  <textarea id="goalInput" rows="3" placeholder="e.g., Build a go-to-market launch plan for a new fitness app, including target audience, social media copy, and pricing tiers."></textarea>
  <button id="runBtn" onclick="deployAgents()">Spawn & Run Agent Team</button>

  <div id="loader" class="loader">🧠 Meta-Agent is creating your custom team and executing tasks... (This takes 10–20 seconds)</div>
  <div id="results"></div>

  <script>
    async function deployAgents() {
      const goal = document.getElementById("goalInput").value.trim();
      const btn = document.getElementById("runBtn");
      const loader = document.getElementById("loader");
      const resultsDiv = document.getElementById("results");

      if (!goal) return alert("Please enter a goal first!");

      btn.disabled = true;
      loader.style.display = "block";
      resultsDiv.innerHTML = "";

      try {
        const response = await fetch("/api/create-agents", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ goal: goal })
        });

        const data = await response.json();

        if (data.status === "error") {
          throw new Error(data.message);
        }

        data.team.forEach(agent => {
          const card = document.createElement("div");
          card.className = "agent-card";
          card.innerHTML = `
            <div class="agent-header">
              <span class="agent-name">🤖 ${agent.name}</span>
              <span class="agent-role">${agent.role}</span>
            </div>
            <div class="agent-task"><strong>Assigned Task:</strong> ${agent.task}</div>
            <pre>${agent.output}</pre>
          `;
          resultsDiv.appendChild(card);
        });

      } catch (err) {
        resultsDiv.innerHTML = `<div class="agent-card" style="border-color: #ef4444;"><strong>Error:</strong> ${err.message}</div>`;
      } finally {
        btn.disabled = false;
        loader.style.display = "none";
      }
    }
  </script>
</body>
</html>
